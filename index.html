<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LegalEase</title>
<style>
body{font-family:Arial;background:#f4f6f9;margin:0}
header{background:#0a1931;color:white;padding:20px;text-align:center}
.box{max-width:800px;margin:30px auto;background:white;padding:20px;border-radius:12px;box-shadow:0 2px 10px #ccc}
textarea{width:100%;height:150px;padding:10px;border-radius:6px;border:1px solid #ccc}
button{background:#0a1931;color:white;padding:12px 20px;border:none;border-radius:6px;cursor:pointer;margin-top:10px}
#output{margin-top:20px;background:#eef2ff;padding:15px;border-radius:6px;min-height:80px}
</style>
</head>
<body>
<header>
<h1>LegalEase</h1>
<p>AI Legal Document Simplifier</p>
</header>
<div class="box">
<h3>Legal Text Paste Pannunga</h3>
<textarea id="input" placeholder="Example: The party of the first part hereby agrees..."></textarea>
<br>
<button onclick="simplify()">Simplify Pannu</button>
<div id="output">Simplified output inga varum...</div>
</div>
<script>
function simplify(){
let text=document.getElementById("input").value;
if(text==""){document.getElementById("output").innerText="First konjam legal text paste pannunga!";return;}
document.getElementById("output").innerText="Simple Meaning: \n\n"+text+"\n\n(Easy words la: ithu rendu perum agreement ku ok solrangannu artham)";
}
</script>
</body>
</html>
